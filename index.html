<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grant's Demo Project</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      text-align: center;
      padding: 3rem 4rem;
      border: 1px solid #333;
      border-radius: 16px;
      background: #1a1a1a;
      max-width: 500px;
    }
    .badge {
      display: inline-block;
      background: #22c55e22;
      color: #22c55e;
      border: 1px solid #22c55e44;
      border-radius: 999px;
      font-size: 0.75rem;
      padding: 0.25rem 0.75rem;
      margin-bottom: 1.5rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    p {
      color: #999;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .stack {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .tag {
      background: #ffffff0f;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Live on Vercel</div>
    <h1>Grant's Demo Project</h1>
    <p>Claude Code environment is fully set up and deployed. This page confirms the full pipeline is working.</p>
    <div class="stack">
      <span class="tag">Claude Code</span>
      <span class="tag">GitHub</span>
      <span class="tag">Vercel</span>
      <span class="tag">VS Code</span>
    </div>
  </div>
</body>
</html>
